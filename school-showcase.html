<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School-Level Showcase — STEP Odisha</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/nav.css">
<style>
  .wrap { max-width: 820px; margin: 0 auto; padding: var(--sp-7) var(--sp-4) var(--sp-8); }
  @media (min-width: 768px) { .wrap { padding: var(--sp-8) var(--sp-5) var(--sp-8); } }
  .placeholder-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: var(--sp-7) var(--sp-6); text-align: center;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.05);
  }
  .placeholder-card .icon {
    width: 60px; height: 60px; margin: 0 auto var(--sp-5); color: var(--primary-tint);
  }
  .placeholder-card .eyebrow {
    display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); background: var(--primary-soft); padding: 4px 12px; border-radius: 999px; margin-bottom: var(--sp-4);
  }
  .placeholder-card h1 { font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2.1rem); color: var(--primary); margin: 0 0 var(--sp-3); font-weight: 800; }
  .placeholder-card p { color: var(--text-secondary); font-size: 0.98rem; line-height: 1.6; max-width: 56ch; margin: 0 auto var(--sp-6); }
  .btn-back {
    display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 700;
    color: #fff; background: var(--primary); padding: 11px 22px; border-radius: 10px; text-decoration: none;
  }
  .btn-back:hover { background: var(--primary-tint); }
</style>
</head>
<body>
<div class="viz-root">
<div class="app-shell">
<div id="app-nav"></div>
<div class="app-main">
<div class="wrap">
  <div class="placeholder-card">
    <span class="eyebrow">Coming soon</span>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="5"></circle><path d="M8.3 12.9 6.5 21l5.5-3.2 5.5 3.2-1.8-8.1"></path></svg>
    <h1>School-Level Showcase</h1>
    <p>Showcase events, student participation, innovative projects, photographs (where available), and success stories from schools. This section is planned but not yet built.</p>
    <a class="btn-back" href="dashboard.html">&larr; Back to Dashboard</a>
  </div>
</div>
</div>
</div>
</div>
<script src="assets/nav.js"></script>
</body>
</html>
